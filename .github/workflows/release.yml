name: Publish integration release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - custom_components/hyperhdr_integration/manifest.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hyperhdr-integration-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from integration manifest
        id: version
        shell: bash
        run: |
          version="$(python3 -c 'import json; print(json.load(open("custom_components/hyperhdr_integration/manifest.json"))["version"])')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a version such as 2.1.9 in manifest.json"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already released
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $VERSION already exists; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag and package integration
        if: steps.existing.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            tag_commit="$(git rev-list -n 1 "$VERSION")"
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $VERSION points to $tag_commit instead of $GITHUB_SHA"
              exit 1
            fi
          fi
          test -s custom_components/hyperhdr_integration/brand/icon.png
          test -s custom_components/hyperhdr_integration/brand/logo.png
          mkdir -p dist
          (cd custom_components && zip -q -r "../dist/hyperhdr_integration-$VERSION.zip" hyperhdr_integration)
          unzip -t "dist/hyperhdr_integration-$VERSION.zip" >/dev/null

      - name: Publish GitHub release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          gh release create "$VERSION" "dist/hyperhdr_integration-$VERSION.zip" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes
